<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser's own bar. Two tags, one per device scheme: the brand green on
         a light device, the page ground on a dark one. The script below rewrites
         both to the same colour when the person has chosen a theme, so a chosen
         theme beats the device. -->
    <meta name="theme-color" content="#1c7c54" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151813" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- A saved light/dark choice is applied before anything paints, bar colour
         included, so a dark phone never flashes a light page (or a green bar on
         a dark choice) while the bundle loads. lib/theme.js applies the same
         answer again once it is running; the two colours must match BAR there. -->
    <script>
      try {
        var t = localStorage.getItem('recipebox:theme')
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t)
          var bar = t === 'dark' ? '#151813' : '#1c7c54'
          var tags = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < tags.length; i++) tags[i].setAttribute('content', bar)
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fallback for anything that won't take an SVG favicon. -->
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen is the only install path on iOS, and these are what
         it reads: capable makes the launch standalone rather than a Safari tab,
         title names the icon. status-bar-style stays "default" (opaque, content
         below it) because the layout adds no top safe-area padding of its own.
         It is one fixed value that cannot follow dark mode (the other styles
         paint white icons or take the body colour), so an installed iPhone app
         shows a light status strip over the dark theme: a platform limit, not
         something the page can change after install. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Recipes" />
    <title>Recipe Box</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
